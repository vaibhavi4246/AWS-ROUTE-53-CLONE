name: Keep backend awake

# Render's free tier sleeps after ~15 minutes without traffic. Pinging /health every 10 minutes
# keeps the backend warm. Set the repository variable BACKEND_URL (Settings > Secrets and variables >
# Actions > Variables), e.g. https://aws-route53-clone-backend.onrender.com
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL variable is not set; nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors "${BACKEND_URL%/}/health"
